<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cartas - Cookie Run Kingdom</title>
    <link rel="stylesheet" href="../public/style.css">
</head>

<body>

    <div id="introOverlay" class="intro-overlay">
        <div id="introScreen" class="intro-screen">
            <button id="btnAbrirCatalogo" class="btn-abrir-catalogo">
                Abrir Catálogo
            </button>
        </div>

        <video id="videoForno" class="video-forno" playsinline>
            <source src="../public/animacao.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>

        <div id="fadeWhite" class="fade-white"></div>
    </div>

    <header class="header">
        <div class="header-decoration"></div>
        <div class="titulo">
            <span>Catálogo de cartas</span>
            <h1>Cookie Run: Kingdom</h1>
        </div>
    </header>

    <main class="layout">

        <aside class="sidebar-left">
            <h2>FILTROS</h2>

            <div class="filtro">
                <label for="tipoFiltro">Tipo</label>
                <select id="tipoFiltro">
                    <option value="">Todos</option>
                    <option value="Suporte">Suporte</option>
                    <option value="Defesa">Defesa</option>
                    <option value="Magia">Magia</option>
                    <option value="Ataque">Ataque</option>
                    <option value="Carga">Carga</option>
                </select>
            </div>

            <div class="filtro">
                <label for="raridadeFiltro">Raridade</label>
                <select id="raridadeFiltro">
                    <option value="">Todas</option>
                    <option value="Comum">Comum</option>
                    <option value="Raro">Raro</option>
                    <option value="Epica">Épica</option>
                    <option value="Lendaria">Lendária</option>
                    <option value="Ancestral">Ancestral</option>
                </select>
            </div>

            <div class="filtro">
                <button id="btnFiltroFavoritos" class="btn-filtro-favorito">
                    ⭐ Apenas Favoritos
                </button>
            </div>

            <button id="limparFiltros" class="btn-limpar">
                Limpar filtros
            </button>
        </aside>

        <section class="conteudo">
            <div class="pesquisa-container">
                <input
                    type="text"
                    id="campoPesquisa"
                    placeholder="Pesquisar carta..."
                    autocomplete="off"
                >
                <button id="botaoPesquisa" title="Pesquisar">
                    🔍
                </button>
            </div>

            <div class="resultado-info">
                <span id="contador">
                    Carregando cartas...
                </span>
            </div>

            <div id="catalogo" class="catalogo"></div>

            <div id="semResultados" class="sem-resultados">
                <div class="icone-vazio">🍪</div>
                <h2>Nenhuma carta encontrada</h2>
                <p>Tente alterar sua pesquisa ou os filtros.</p>
            </div>
        </section>

        <aside class="sidebar-right">
            <div class="decoracao-cookie">🍪</div>
            <div class="decoracao-linha"></div>
            <div class="decoracao-cookie pequeno">✦</div>
        </aside>

    </main>

    <div id="modalDetalhes" class="modal" onclick="fecharModalDetalhes(event)">
        <div class="modal-carta-wrapper">
            <button type="button" class="btn-fechar-detalhes" onclick="fecharModalDetalhes()">×</button>
            <div class="botoes-topo-modal">
                <button type="button" id="btnFavoritarCarta" class="btn-favoritar-topo">⭐ Favoritar</button>
                <button type="button" id="btnDeletarCarta" class="btn-deletar-topo">🗑️ Deletar</button>
            </div>
            <div id="modalCartaContainer"></div>
        </div>
    </div>

    <div id="modalConfirmarExclusao" class="modal">
        <div class="modal-conteudo modal-confirmacao">
            <h2>Quer mesmo deletar essa carta?</h2>
            <div class="botoes-confirmacao">
                <button type="button" id="btnConfirmarSim" class="btn-confirmar sim">Sim</button>
                <button type="button" id="btnConfirmarNao" class="btn-confirmar nao" onclick="fecharModalConfirmacao()">Não</button>
            </div>
        </div>
    </div>

    <div id="modalCadastro" class="modal">
        <div class="modal-conteudo">
            <button type="button" class="btn-fechar" onclick="fecharModal()">×</button>
            <h2>Nova Carta</h2>
            
            <form id="formCadastro">
                <div class="campo-grupo">
                    <label for="novoNome">Nome do Cookie</label>
                    <input type="text" id="novoNome" placeholder="Ex: Cookie de Gengibre" required />
                </div>
                <div class="campo-grupo">
                    <label for="novoTipo">Tipo</label>
                    <select id="novoTipo" required>
                        <option value="" disabled selected hidden>Selecione o Tipo</option>
                        <option value="Suporte">Suporte</option>
                        <option value="Defesa">Defesa</option>
                        <option value="Magia">Magia</option>
                        <option value="Ataque">Ataque</option>
                        <option value="Carga">Carga</option>
                    </select>
                </div>
                <div class="campo-grupo">
                    <label for="novaRaridade">Raridade</label>
                    <select id="novaRaridade" required>
                        <option value="" disabled selected hidden>Selecione a Raridade</option>
                        <option value="Comum">Comum</option>
                        <option value="Raro">Raro</option>
                        <option value="Epica">Épica</option>
                        <option value="Lendaria">Lendária</option>
                        <option value="Ancestral">Ancestral</option>
                    </select>
                </div>
                <div class="campo-grupo">
                    <label for="novoCusto">Custo de Energia</label>
                    <input type="number" id="novoCusto" placeholder="Ex: 3" min="1" max="10" required />
                </div>
                <div class="campo-grupo">
                    <label for="novaImagem">Imagem da Carta</label>
                    <input type="file" id="novaImagem" accept="image/*" required />
                </div>
                <button type="submit" class="btn-salvar">Salvar Carta ✨</button>
            </form>
        </div>
    </div>

    <script src="../public/script.js" defer></script>
</body>

</html>
